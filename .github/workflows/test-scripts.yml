name: Pipeline scripts unit tests
on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/test-scripts.yml'
jobs:
  test-deploy-traffic-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deploy-traffic-light unit tests
        run: bash .github/scripts/test-deploy-traffic-light.sh

  test-swap-instances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run swap-instances unit tests
        run: bash .github/scripts/tests/swap-instances.test.sh

  test-configure-caprover-cmd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run configure-caprover-app --cmd flag tests
        run: bash .github/scripts/tests/configure-caprover-cmd.test.sh
