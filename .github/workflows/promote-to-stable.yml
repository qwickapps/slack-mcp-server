# qwickapps/slack-mcp-server - corrected UAT -> live/stable promotion on oci-main.

name: Promote Slack App UAT to Live/Stable

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App to promote'
        required: true
        type: choice
        options: [slack-mcp-server, slack-bridge, slack-multiplexer, slack-setup]
        default: slack-mcp-server
      health_path:
        description: 'Override health path. Defaults to /sse for slack-mcp-server and /_health for the three P3 apps.'
        required: false
        type: string
        default: ''

concurrency:
  group: slack-promote-uat-to-live-stable-${{ inputs.app_name }}
  cancel-in-progress: false

env:
  OWNER: qwickapps

jobs:
  promote-uat-to-live-stable:
    runs-on: [self-hosted, macmini]
    steps:
      - name: Validate inputs and resolve slots
        id: meta
        run: |
          APP="${{ inputs.app_name }}"
          case "$APP" in
            slack-mcp-server)
              DEFAULT_HEALTH_PATH="/sse"
              ;;
            slack-bridge|slack-multiplexer|slack-setup)
              DEFAULT_HEALTH_PATH="/_health"
              ;;
            *)
              echo "ERROR: unsupported app_name: $APP"
              exit 1
              ;;
          esac

          HEALTH_PATH="${{ inputs.health_path }}"
          if [ -z "$HEALTH_PATH" ]; then
            HEALTH_PATH="$DEFAULT_HEALTH_PATH"
          fi
          case "$HEALTH_PATH" in
            /*) ;;
            *)
              echo "ERROR: health_path must start with /"
              exit 1
              ;;
          esac

          echo "uat_app=${APP}-uat" >> "$GITHUB_OUTPUT"
          echo "live_app=${APP}-live" >> "$GITHUB_OUTPUT"
          echo "stable_app=${APP}-stable" >> "$GITHUB_OUTPUT"
          echo "live_app_url=https://${APP}-live.app.qwickforge.com" >> "$GITHUB_OUTPUT"
          echo "stable_app_url=https://${APP}-stable.app.qwickforge.com" >> "$GITHUB_OUTPUT"
          echo "health_path=${HEALTH_PATH}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve oci-main CapRover credentials
        run: |
          CAPROVER_URL="${{ secrets.OCI_MAIN_CAPROVER_URL }}"
          CAPROVER_PASSWORD="${{ secrets.OCI_MAIN_CAPROVER_PASSWORD }}"
          GHCR_PULL_TOKEN="${{ secrets.GHCR_PULL_TOKEN }}"

          if [ -z "$CAPROVER_URL" ] || [ -z "$CAPROVER_PASSWORD" ]; then
            echo "ERROR: OCI_MAIN_CAPROVER_URL and OCI_MAIN_CAPROVER_PASSWORD are required."
            exit 1
          fi
          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "ERROR: GHCR_PULL_TOKEN is required."
            exit 1
          fi

          echo "::add-mask::$CAPROVER_PASSWORD"
          echo "::add-mask::$GHCR_PULL_TOKEN"
          echo "CAPROVER_URL=$CAPROVER_URL" >> "$GITHUB_ENV"
          echo "CAPROVER_PASSWORD=$CAPROVER_PASSWORD" >> "$GITHUB_ENV"
          echo "GHCR_PULL_TOKEN=$GHCR_PULL_TOKEN" >> "$GITHUB_ENV"

      - name: Read UAT and live image digests
        id: images
        run: |
          chmod +x .github/scripts/*.sh
          UAT_IMAGE_REF="$(.github/scripts/caprover-slot-admin.sh image \
            --app-name "${{ steps.meta.outputs.uat_app }}" \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD")"
          LIVE_IMAGE_REF="$(.github/scripts/caprover-slot-admin.sh image \
            --app-name "${{ steps.meta.outputs.live_app }}" \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD")"

          if ! printf '%s' "$UAT_IMAGE_REF" | grep -Eq '^ghcr.io/qwickapps/img-(slack-mcp-server|slack-bridge|slack-multiplexer|slack-setup)-dev@sha256:[0-9a-f]{64}$'; then
            echo "ERROR: UAT slot is not deployed by immutable dev digest."
            echo "Got: $UAT_IMAGE_REF"
            exit 1
          fi
          if [ -z "$LIVE_IMAGE_REF" ]; then
            echo "ERROR: live slot has no image; cannot establish stable rollback image."
            exit 1
          fi

          echo "uat_image_ref=$UAT_IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "live_image_ref=$LIVE_IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "UAT image to promote: $UAT_IMAGE_REF"
          echo "Current live image for stable: $LIVE_IMAGE_REF"

      - name: Copy live config to stable
        run: |
          .github/scripts/caprover-slot-admin.sh copy-config \
            --source-app-name "${{ steps.meta.outputs.live_app }}" \
            --target-app-name "${{ steps.meta.outputs.stable_app }}" \
            --source-caprover-url "$CAPROVER_URL" \
            --source-caprover-password "$CAPROVER_PASSWORD" \
            --target-caprover-url "$CAPROVER_URL" \
            --target-caprover-password "$CAPROVER_PASSWORD"

      - name: Deploy current live image to stable
        run: |
          .github/scripts/deploy-from-ghcr.sh \
            --app-name "${{ steps.meta.outputs.stable_app }}" \
            --image-ref "${{ steps.images.outputs.live_image_ref }}" \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD" \
            --github-token "$GHCR_PULL_TOKEN" \
            --github-owner "${{ env.OWNER }}"

      - name: Validate stable slot health
        run: |
          .github/scripts/caprover-slot-admin.sh enable-ssl \
            --app-name "${{ steps.meta.outputs.stable_app }}" \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD"

          .github/scripts/validate-deployment-health.sh \
            --app-name "${{ steps.meta.outputs.stable_app }}" \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD" \
            --app-url "${{ steps.meta.outputs.stable_app_url }}" \
            --health-path "${{ steps.meta.outputs.health_path }}" \
            --max-attempts 15 \
            --sleep 20

      - name: Deploy UAT image digest to live
        run: |
          .github/scripts/deploy-from-ghcr.sh \
            --app-name "${{ steps.meta.outputs.live_app }}" \
            --image-ref "${{ steps.images.outputs.uat_image_ref }}" \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD" \
            --github-token "$GHCR_PULL_TOKEN" \
            --github-owner "${{ env.OWNER }}"

      - name: Validate live slot health
        run: |
          .github/scripts/caprover-slot-admin.sh enable-ssl \
            --app-name "${{ steps.meta.outputs.live_app }}" \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD"

          .github/scripts/validate-deployment-health.sh \
            --app-name "${{ steps.meta.outputs.live_app }}" \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD" \
            --app-url "${{ steps.meta.outputs.live_app_url }}" \
            --health-path "${{ steps.meta.outputs.health_path }}" \
            --max-attempts 15 \
            --sleep 20
