# qwickapps/slack-mcp-server — manual promote-to-live for the blue-green pipeline.
# Health validation is implemented as an inline curl loop so this workflow
# is self-contained.
#
# Health path: /sse (the MCP SSE endpoint; upstream has no dedicated /_health).
# Port: 13080 (controlled via SLACK_MCP_PORT env var — no --port CLI flag).

name: Promote slack-mcp-server to Live

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: |
          Full GHCR image reference to deploy as live.
          Example: ghcr.io/qwickapps/img-slack-mcp-server-prod:1.0.0.42
        required: true
        type: string
      environment:
        description: 'Target environment for live slot'
        required: true
        type: choice
        options: [prod, uat]
        default: prod

concurrency:
  group: slack-mcp-server-promote-live-${{ inputs.environment }}
  cancel-in-progress: false

env:
  APP_NAME: slack-mcp-server
  OWNER: qwickapps
  HEALTH_PATH: /sse

jobs:
  promote-to-live:
    runs-on: [self-hosted, macmini]
    steps:
      - name: Validate image_ref input
        run: |
          IMAGE_REF="${{ inputs.image_ref }}"
          if [ -z "$IMAGE_REF" ]; then
            echo "ERROR: image_ref input is required."
            exit 1
          fi
          if ! echo "$IMAGE_REF" | grep -q 'ghcr.io/qwickapps/img-slack-mcp-server-'; then
            echo "ERROR: image_ref does not look like a slack-mcp-server GHCR image."
            echo "  Got: $IMAGE_REF"
            echo "  Expected format: ghcr.io/qwickapps/img-slack-mcp-server-{prod|uat}:<tag>"
            exit 1
          fi
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_ENV"

      - name: Resolve CapRover credentials and slot names
        run: |
          ENV="${{ inputs.environment }}"

          case "$ENV" in
            prod)
              LIVE_APP="${{ env.APP_NAME }}-live"
              CAPROVER_URL="${{ secrets.OCI_MAIN_CAPROVER_URL }}"
              CAPROVER_PASSWORD="${{ secrets.OCI_MAIN_CAPROVER_PASSWORD }}"
              LIVE_APP_URL="https://${{ env.APP_NAME }}-live.app.qwickforge.com"
              GATEWAY_APP_NAME="${{ env.APP_NAME }}"
              ;;
            uat)
              LIVE_APP="${{ env.APP_NAME }}-uat"
              CAPROVER_URL="${{ secrets.OCI_MAIN_CAPROVER_URL }}"
              CAPROVER_PASSWORD="${{ secrets.OCI_MAIN_CAPROVER_PASSWORD }}"
              LIVE_APP_URL="https://${{ env.APP_NAME }}-uat.app.qwickforge.com"
              GATEWAY_APP_NAME="${{ env.APP_NAME }}-uat"
              ;;
          esac

          echo "::add-mask::$CAPROVER_PASSWORD"
          echo "::add-mask::${{ secrets.GHCR_PULL_TOKEN }}"

          echo "LIVE_APP=${LIVE_APP}"                 >> "$GITHUB_ENV"
          echo "CAPROVER_URL=${CAPROVER_URL}"         >> "$GITHUB_ENV"
          echo "CAPROVER_PASSWORD=${CAPROVER_PASSWORD}" >> "$GITHUB_ENV"
          echo "LIVE_APP_URL=${LIVE_APP_URL}"         >> "$GITHUB_ENV"
          echo "GATEWAY_APP_NAME=${GATEWAY_APP_NAME}" >> "$GITHUB_ENV"
          echo "GHCR_PULL_TOKEN=${{ secrets.GHCR_PULL_TOKEN }}" >> "$GITHUB_ENV"

      - name: Obtain CapRover auth token
        run: |
          TOKEN=$(curl -sf -X POST "${CAPROVER_URL}/api/v2/login" \
            -H "Content-Type: application/json" \
            -d "{\"password\":\"${CAPROVER_PASSWORD}\"}" \
            | tr -d '\n' \
            | sed 's/.*"token":"\([^"]*\)".*/\1/')

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to obtain CapRover token"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "CAPROVER_TOKEN=${TOKEN}" >> "$GITHUB_ENV"

      - name: Ensure live slot exists on CapRover
        run: |
          EXISTS=$(curl -sf "${CAPROVER_URL}/api/v2/user/apps/appDefinitions" \
            -H "x-captain-auth: ${CAPROVER_TOKEN}" \
            -H "x-namespace: captain" \
            | tr -d '\n' \
            | grep -o "\"appName\":\"${LIVE_APP}\"" || true)

          if [ -z "$EXISTS" ]; then
            echo "Creating live app slot '${LIVE_APP}' on CapRover..."
            curl -sf -X POST "${CAPROVER_URL}/api/v2/user/apps/appDefinitions/register" \
              -H "Content-Type: application/json" \
              -H "x-captain-auth: ${CAPROVER_TOKEN}" \
              -H "x-namespace: captain" \
              -d "{\"appName\":\"${LIVE_APP}\",\"hasPersistentData\":false}"
            echo "Live slot created."
          else
            echo "Live slot '${LIVE_APP}' already exists."
          fi

      - name: Deploy image_ref to live slot
        run: |
          echo "Deploying ${image_ref} to ${LIVE_APP}..."

          # Register GHCR pull credentials on the app
          curl -sf -X POST "${CAPROVER_URL}/api/v2/user/apps/appDefinitions/update" \
            -H "Content-Type: application/json" \
            -H "x-captain-auth: ${CAPROVER_TOKEN}" \
            -H "x-namespace: captain" \
            -d "{
              \"appName\": \"${LIVE_APP}\",
              \"instanceCount\": 1,
              \"captainDefinitionContent\": \"{\\\"schemaVersion\\\":2,\\\"imageName\\\":\\\"${image_ref}\\\"}\",
              \"registryAuthHeader\": \"$(printf '%s:%s' '${{ github.actor }}' "${GHCR_PULL_TOKEN}" | base64 | tr -d '\n')\"
            }" || true

          # Trigger deploy
          DEPLOY_RESULT=$(curl -sf -X POST "${CAPROVER_URL}/api/v2/user/apps/appDefinitions/update" \
            -H "Content-Type: application/json" \
            -H "x-captain-auth: ${CAPROVER_TOKEN}" \
            -H "x-namespace: captain" \
            -d "{
              \"appName\": \"${LIVE_APP}\",
              \"forceBuild\": false,
              \"captainDefinitionContent\": \"{\\\"schemaVersion\\\":2,\\\"imageName\\\":\\\"${image_ref}\\\"}\"
            }" 2>&1 || true)

          echo "Deploy API response: ${DEPLOY_RESULT}"

      - name: Validate live slot health
        run: |
          HEALTH_URL="${LIVE_APP_URL}${{ env.HEALTH_PATH }}"
          echo "Waiting for ${HEALTH_URL} to become healthy..."
          MAX_ATTEMPTS=15
          SLEEP_SEC=20
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            # Use --max-time 2 so curl does not block on the SSE stream forever.
            # Exit 28 (operation timeout) means curl connected and got 200 OK but kept the
            # SSE stream open — that is a healthy response. Exit 0 is also healthy.
            curl -fsS --max-time 2 "$HEALTH_URL" >/dev/null 2>&1
            rc=$?
            echo "  Attempt ${attempt}/${MAX_ATTEMPTS}: curl exit ${rc}"
            if [ $rc -eq 0 ] || [ $rc -eq 28 ]; then
              echo "Health check passed (exit ${rc})."
              exit 0
            fi
            [ "$attempt" -lt "$MAX_ATTEMPTS" ] && sleep "$SLEEP_SEC"
          done
          echo "ERROR: Health check failed after ${MAX_ATTEMPTS} attempts."
          exit 1

      - name: Notify via Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          ENV="${{ inputs.environment }}"
          IMAGE_REF="${{ inputs.image_ref }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" = "success" ]; then
            EMOJI="[OK]"
            printf -v MSG '%s\n\n%s\n%s\n%s\n\n%s\n  image_ref: %s' \
              "${EMOJI} slack-mcp-server promoted to LIVE (${ENV})" \
              "Image: ${IMAGE_REF}" \
              "Live URL: ${LIVE_APP_URL}" \
              "Run: ${RUN_URL}" \
              "Next step — to promote to stable, run promote-to-stable.yml with:" \
              "${IMAGE_REF}"
          else
            EMOJI="[FAIL]"
            printf -v MSG '%s\n\n%s\n%s\n\n%s' \
              "${EMOJI} slack-mcp-server promote-to-live FAILED (${ENV})" \
              "Image: ${IMAGE_REF}" \
              "Run: ${RUN_URL}" \
              "Check logs before re-attempting."
          fi

          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}" \
              || echo "WARN: Telegram notification failed (non-fatal)"
          else
            echo "WARN: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set — skipping notification"
          fi
