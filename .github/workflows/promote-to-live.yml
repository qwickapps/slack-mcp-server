# qwickapps/slack-mcp-server — manual promote-to-live for the blue-green pipeline.
#
# qwickapps/mcp#84 Gap-4 generalisation: this workflow now accepts an
# `app_name` input (default: slack-mcp-server) so the same workflow
# promotes any of the four apps in the slack ecosystem:
#   slack-mcp-server | slack-bridge | slack-multiplexer | slack-setup
# Per-app slot names, health paths, and image refs are resolved at
# the head of the run via .github/scripts/resolve-deploy-config.sh.
#
# Health endpoints differ per app:
#   slack-mcp-server  -> /sse  (SSE stream — curl --max-time 2;
#                               exit 0 OR 28 means healthy)
#   slack-bridge      -> /health
#   slack-multiplexer -> /health
#   slack-setup       -> /health

name: Promote to Live

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Which app to promote'
        required: true
        type: choice
        options:
          - slack-mcp-server
          - slack-bridge
          - slack-multiplexer
          - slack-setup
        default: slack-mcp-server
      image_ref:
        description: |
          Full GHCR image reference to deploy as live.
          Example: ghcr.io/qwickapps/img-<app>-prod:1.0.0.42
        required: true
        type: string
      environment:
        description: 'Target environment for live slot'
        required: true
        type: choice
        options: [prod, uat]
        default: prod

concurrency:
  # Group by app + environment so two promotions of the same app can't
  # race, but different apps can promote in parallel.
  group: promote-live-${{ inputs.app_name }}-${{ inputs.environment }}
  cancel-in-progress: false

env:
  OWNER: qwickapps

jobs:
  promote-to-live:
    runs-on: [self-hosted, macmini]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve app config
        run: |
          chmod +x .github/scripts/resolve-deploy-config.sh
          .github/scripts/resolve-deploy-config.sh \
            --app "${{ inputs.app_name }}" \
            --environment "${{ inputs.environment }}"

      - name: Validate image_ref input
        run: |
          IMAGE_REF="${{ inputs.image_ref }}"
          if [ -z "$IMAGE_REF" ]; then
            echo "ERROR: image_ref input is required."
            exit 1
          fi
          if ! echo "$IMAGE_REF" | grep -q "$IMAGE_REF_VALIDATOR_PREFIX"; then
            echo "ERROR: image_ref does not look like a $APP_NAME GHCR image."
            echo "  Got:      $IMAGE_REF"
            echo "  Expected: ${IMAGE_REF_VALIDATOR_PREFIX}{prod|uat}:<tag>"
            exit 1
          fi
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_ENV"

      - name: Resolve CapRover credentials
        run: |
          CAPROVER_URL="${{ secrets.OCI_MAIN_CAPROVER_URL }}"
          CAPROVER_PASSWORD="${{ secrets.OCI_MAIN_CAPROVER_PASSWORD }}"

          echo "::add-mask::$CAPROVER_PASSWORD"
          echo "::add-mask::${{ secrets.GHCR_PULL_TOKEN }}"

          echo "CAPROVER_URL=${CAPROVER_URL}"             >> "$GITHUB_ENV"
          echo "CAPROVER_PASSWORD=${CAPROVER_PASSWORD}"   >> "$GITHUB_ENV"
          echo "GHCR_PULL_TOKEN=${{ secrets.GHCR_PULL_TOKEN }}" >> "$GITHUB_ENV"

      - name: Obtain CapRover auth token
        run: |
          TOKEN=$(curl -sf -X POST "${CAPROVER_URL}/api/v2/login" \
            -H "Content-Type: application/json" \
            -d "{\"password\":\"${CAPROVER_PASSWORD}\"}" \
            | tr -d '\n' \
            | sed 's/.*"token":"\([^"]*\)".*/\1/')

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to obtain CapRover token"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "CAPROVER_TOKEN=${TOKEN}" >> "$GITHUB_ENV"

      - name: Ensure live slot exists on CapRover
        run: |
          EXISTS=$(curl -sf "${CAPROVER_URL}/api/v2/user/apps/appDefinitions" \
            -H "x-captain-auth: ${CAPROVER_TOKEN}" \
            -H "x-namespace: captain" \
            | tr -d '\n' \
            | grep -o "\"appName\":\"${LIVE_APP}\"" || true)

          if [ -z "$EXISTS" ]; then
            echo "Creating live app slot '${LIVE_APP}' on CapRover..."
            curl -sf -X POST "${CAPROVER_URL}/api/v2/user/apps/appDefinitions/register" \
              -H "Content-Type: application/json" \
              -H "x-captain-auth: ${CAPROVER_TOKEN}" \
              -H "x-namespace: captain" \
              -d "{\"appName\":\"${LIVE_APP}\",\"hasPersistentData\":false}"
            echo "Live slot created."
          else
            echo "Live slot '${LIVE_APP}' already exists."
          fi

      - name: Deploy image_ref to live slot
        run: |
          echo "Deploying ${image_ref} to ${LIVE_APP}..."

          # Register GHCR pull credentials on the app
          curl -sf -X POST "${CAPROVER_URL}/api/v2/user/apps/appDefinitions/update" \
            -H "Content-Type: application/json" \
            -H "x-captain-auth: ${CAPROVER_TOKEN}" \
            -H "x-namespace: captain" \
            -d "{
              \"appName\": \"${LIVE_APP}\",
              \"instanceCount\": 1,
              \"captainDefinitionContent\": \"{\\\"schemaVersion\\\":2,\\\"imageName\\\":\\\"${image_ref}\\\"}\",
              \"registryAuthHeader\": \"$(printf '%s:%s' '${{ github.actor }}' "${GHCR_PULL_TOKEN}" | base64 | tr -d '\n')\"
            }" || true

          # Trigger deploy
          DEPLOY_RESULT=$(curl -sf -X POST "${CAPROVER_URL}/api/v2/user/apps/appDefinitions/update" \
            -H "Content-Type: application/json" \
            -H "x-captain-auth: ${CAPROVER_TOKEN}" \
            -H "x-namespace: captain" \
            -d "{
              \"appName\": \"${LIVE_APP}\",
              \"forceBuild\": false,
              \"captainDefinitionContent\": \"{\\\"schemaVersion\\\":2,\\\"imageName\\\":\\\"${image_ref}\\\"}\"
            }" 2>&1 || true)

          echo "Deploy API response: ${DEPLOY_RESULT}"

      - name: Validate live slot health
        run: |
          HEALTH_URL="${LIVE_APP_URL}${HEALTH_PATH}"
          echo "Waiting for ${HEALTH_URL} to become healthy..."
          MAX_ATTEMPTS=15
          SLEEP_SEC=20
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            # Use --max-time 2 so curl does not block on long-lived
            # streams (slack-mcp-server's /sse). Exit 28 (operation
            # timeout) means curl connected and got 200 OK but kept
            # the stream open — that is a healthy response. Exit 0
            # is also healthy (the /health endpoints on the new
            # apps return immediately).
            curl -fsS --max-time 2 "$HEALTH_URL" >/dev/null 2>&1
            rc=$?
            echo "  Attempt ${attempt}/${MAX_ATTEMPTS}: curl exit ${rc}"
            if [ $rc -eq 0 ] || [ $rc -eq 28 ]; then
              echo "Health check passed (exit ${rc})."
              exit 0
            fi
            [ "$attempt" -lt "$MAX_ATTEMPTS" ] && sleep "$SLEEP_SEC"
          done
          echo "ERROR: Health check failed after ${MAX_ATTEMPTS} attempts."
          exit 1

      - name: Notify via Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          ENV="${{ inputs.environment }}"
          IMAGE_REF="${{ inputs.image_ref }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" = "success" ]; then
            EMOJI="[OK]"
            printf -v MSG '%s\n\n%s\n%s\n%s\n\n%s\n  app_name:  %s\n  image_ref: %s' \
              "${EMOJI} ${APP_NAME} promoted to LIVE (${ENV})" \
              "Image: ${IMAGE_REF}" \
              "Live URL: ${LIVE_APP_URL}" \
              "Run: ${RUN_URL}" \
              "Next step — to promote to stable, run promote-to-stable.yml with:" \
              "${APP_NAME}" \
              "${IMAGE_REF}"
          else
            EMOJI="[FAIL]"
            printf -v MSG '%s\n\n%s\n%s\n%s\n\n%s' \
              "${EMOJI} ${APP_NAME} promote-to-live FAILED (${ENV})" \
              "Image: ${IMAGE_REF}" \
              "App:   ${APP_NAME}" \
              "Run: ${RUN_URL}" \
              "Check logs before re-attempting."
          fi

          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}" \
              || echo "WARN: Telegram notification failed (non-fatal)"
          else
            echo "WARN: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set — skipping notification"
          fi
