# qwickapps/slack-mcp-server - corrected DEV -> UAT cross-host digest promotion.

name: Promote Slack App Dev Build to UAT

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App to promote'
        required: true
        type: choice
        options: [slack-mcp-server, slack-bridge, slack-multiplexer, slack-setup]
        default: slack-mcp-server
      source_env:
        description: 'Source environment. Corrected SOP supports dev build slots only.'
        required: true
        type: choice
        options: [dev]
        default: dev
      target_env:
        description: 'Target environment on oci-main.'
        required: true
        type: choice
        options: [uat]
        default: uat
      health_path:
        description: 'Override health path. Defaults to /sse for slack-mcp-server and /_health for the three P3 apps.'
        required: false
        type: string
        default: ''

concurrency:
  group: slack-promote-dev-to-uat-${{ inputs.app_name }}
  cancel-in-progress: false

env:
  OWNER: qwickapps

jobs:
  promote-dev-to-uat:
    runs-on: [self-hosted, macmini]
    steps:
      - name: Validate inputs and resolve app metadata
        id: meta
        run: |
          APP="${{ inputs.app_name }}"
          SOURCE_ENV="${{ inputs.source_env }}"
          TARGET_ENV="${{ inputs.target_env }}"

          case "$APP" in
            slack-mcp-server)
              CONTAINER_PORT="13080"
              CMD=""
              DEFAULT_HEALTH_PATH="/sse"
              ;;
            slack-bridge)
              CONTAINER_PORT="13081"
              CMD="/usr/local/bin/token-bridge"
              DEFAULT_HEALTH_PATH="/_health"
              ;;
            slack-multiplexer)
              CONTAINER_PORT="13082"
              CMD="/usr/local/bin/multiplexer"
              DEFAULT_HEALTH_PATH="/_health"
              ;;
            slack-setup)
              CONTAINER_PORT="13083"
              CMD="/usr/local/bin/setup"
              DEFAULT_HEALTH_PATH="/_health"
              ;;
            *)
              echo "ERROR: unsupported app_name: $APP"
              exit 1
              ;;
          esac

          if [ "$SOURCE_ENV" != "dev" ] || [ "$TARGET_ENV" != "uat" ]; then
            echo "ERROR: corrected SOP only allows dev -> uat in this workflow."
            exit 1
          fi

          HEALTH_PATH="${{ inputs.health_path }}"
          if [ -z "$HEALTH_PATH" ]; then
            HEALTH_PATH="$DEFAULT_HEALTH_PATH"
          fi
          case "$HEALTH_PATH" in
            /*) ;;
            *)
              echo "ERROR: health_path must start with /"
              exit 1
              ;;
          esac

          echo "source_app=${APP}-build" >> "$GITHUB_OUTPUT"
          echo "target_app=${APP}-uat" >> "$GITHUB_OUTPUT"
          echo "target_app_url=https://${APP}-uat.app.qwickforge.com" >> "$GITHUB_OUTPUT"
          echo "container_port=${CONTAINER_PORT}" >> "$GITHUB_OUTPUT"
          echo "cmd=${CMD}" >> "$GITHUB_OUTPUT"
          echo "health_path=${HEALTH_PATH}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve CapRover credentials
        run: |
          SOURCE_URL="${{ secrets.OCI_DEV_CAPROVER_URL }}"
          SOURCE_PASSWORD="${{ secrets.OCI_DEV_CAPROVER_PASSWORD }}"
          TARGET_URL="${{ secrets.OCI_MAIN_CAPROVER_URL }}"
          TARGET_PASSWORD="${{ secrets.OCI_MAIN_CAPROVER_PASSWORD }}"
          GHCR_PULL_TOKEN="${{ secrets.GHCR_PULL_TOKEN }}"

          if [ -z "$SOURCE_URL" ] || [ -z "$SOURCE_PASSWORD" ] || [ -z "$TARGET_URL" ] || [ -z "$TARGET_PASSWORD" ]; then
            echo "ERROR: missing CapRover credentials. Required: OCI_DEV_* and OCI_MAIN_*."
            exit 1
          fi
          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "ERROR: GHCR_PULL_TOKEN is required."
            exit 1
          fi

          echo "::add-mask::$SOURCE_PASSWORD"
          echo "::add-mask::$TARGET_PASSWORD"
          echo "::add-mask::$GHCR_PULL_TOKEN"
          echo "SOURCE_CAPROVER_URL=$SOURCE_URL" >> "$GITHUB_ENV"
          echo "SOURCE_CAPROVER_PASSWORD=$SOURCE_PASSWORD" >> "$GITHUB_ENV"
          echo "TARGET_CAPROVER_URL=$TARGET_URL" >> "$GITHUB_ENV"
          echo "TARGET_CAPROVER_PASSWORD=$TARGET_PASSWORD" >> "$GITHUB_ENV"
          echo "GHCR_PULL_TOKEN=$GHCR_PULL_TOKEN" >> "$GITHUB_ENV"

      - name: Read dev build-slot image digest
        id: image
        run: |
          chmod +x .github/scripts/*.sh
          IMAGE_REF="$(.github/scripts/caprover-slot-admin.sh image \
            --app-name "${{ steps.meta.outputs.source_app }}" \
            --caprover-url "$SOURCE_CAPROVER_URL" \
            --caprover-password "$SOURCE_CAPROVER_PASSWORD")"

          if ! printf '%s' "$IMAGE_REF" | grep -Eq '^ghcr.io/qwickapps/img-(slack-mcp-server|slack-bridge|slack-multiplexer|slack-setup)-dev@sha256:[0-9a-f]{64}$'; then
            echo "ERROR: source build slot is not deployed by immutable dev digest."
            echo "Got: $IMAGE_REF"
            exit 1
          fi

          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "Promoting immutable image: $IMAGE_REF"

      - name: Write UAT env file
        env:
          SLACK_MCP_SERVER_UAT_XOXP_TOKEN:                 ${{ secrets.SLACK_MCP_SERVER_UAT_XOXP_TOKEN }}
          SLACK_MCP_SERVER_UAT_XOXC_TOKEN:                 ${{ secrets.SLACK_MCP_SERVER_UAT_XOXC_TOKEN }}
          SLACK_MCP_SERVER_UAT_XOXD_TOKEN:                 ${{ secrets.SLACK_MCP_SERVER_UAT_XOXD_TOKEN }}
          SLACK_MCP_SERVER_UAT_BRIDGE_HMAC_KEY:            ${{ secrets.SLACK_MCP_SERVER_UAT_BRIDGE_HMAC_KEY }}
          SLACK_MCP_SERVER_UAT_TOKEN_ENCRYPTION_KEY:       ${{ secrets.SLACK_MCP_SERVER_UAT_TOKEN_ENCRYPTION_KEY }}
          SLACK_MCP_SERVER_UAT_MULTIPLEXER_SERVICE_KEY:    ${{ secrets.SLACK_MCP_SERVER_UAT_MULTIPLEXER_SERVICE_KEY }}
          SLACK_MCP_SERVER_UAT_SETUP_SERVICE_KEY:          ${{ secrets.SLACK_MCP_SERVER_UAT_SETUP_SERVICE_KEY }}
          SLACK_MCP_SERVER_UAT_DATABASE_URL:               ${{ secrets.SLACK_MCP_SERVER_UAT_DATABASE_URL }}
          SLACK_MCP_SERVER_UAT_BRIDGE_URL:                 ${{ secrets.SLACK_MCP_SERVER_UAT_BRIDGE_URL }}
          SLACK_MCP_SERVER_UAT_TS_AUTHKEY:                 ${{ secrets.SLACK_MCP_SERVER_UAT_TS_AUTHKEY }}
          SLACK_MCP_SERVER_UAT_TS_API_KEY:                 ${{ secrets.SLACK_MCP_SERVER_UAT_TS_API_KEY }}
        run: |
          ENV_FILE="/tmp/app-env-uat-${{ inputs.app_name }}.env"
          .github/scripts/write-slack-app-env-file.sh \
            --app-name "${{ inputs.app_name }}" \
            --environment uat \
            --output "$ENV_FILE"
          echo "PROMOTE_ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"

      - name: Configure UAT slot on oci-main
        run: |
          CMD_ARGS=()
          if [ -n "${{ steps.meta.outputs.cmd }}" ]; then
            CMD_ARGS=(--cmd "${{ steps.meta.outputs.cmd }}")
          fi

          .github/scripts/configure-caprover-app.sh \
            --app-name "${{ steps.meta.outputs.target_app }}" \
            --caprover-url "$TARGET_CAPROVER_URL" \
            --caprover-password "$TARGET_CAPROVER_PASSWORD" \
            --container-port "${{ steps.meta.outputs.container_port }}" \
            --env-file "$PROMOTE_ENV_FILE" \
            "${CMD_ARGS[@]}"

      - name: Deploy dev digest to UAT slot
        run: |
          .github/scripts/deploy-from-ghcr.sh \
            --app-name "${{ steps.meta.outputs.target_app }}" \
            --image-ref "${{ steps.image.outputs.image_ref }}" \
            --caprover-url "$TARGET_CAPROVER_URL" \
            --caprover-password "$TARGET_CAPROVER_PASSWORD" \
            --github-token "$GHCR_PULL_TOKEN" \
            --github-owner "${{ env.OWNER }}"

      - name: Validate UAT slot health
        run: |
          .github/scripts/validate-deployment-health.sh \
            --app-name "${{ steps.meta.outputs.target_app }}" \
            --caprover-url "$TARGET_CAPROVER_URL" \
            --caprover-password "$TARGET_CAPROVER_PASSWORD" \
            --app-url "${{ steps.meta.outputs.target_app_url }}" \
            --health-path "${{ steps.meta.outputs.health_path }}" \
            --max-attempts 15 \
            --sleep 20

      - name: Remove UAT env file
        if: always()
        run: |
          if [ -n "${PROMOTE_ENV_FILE:-}" ]; then
            rm -f "$PROMOTE_ENV_FILE"
            echo "Removed $PROMOTE_ENV_FILE"
          fi
