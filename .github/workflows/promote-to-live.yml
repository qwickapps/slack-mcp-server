# qwickapps/slack-mcp-server - manual promote-to-live for the blue-green pipeline.

name: Promote Slack App to Live

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App to promote'
        required: true
        type: choice
        options: [slack-mcp-server, slack-bridge, slack-multiplexer, slack-setup]
        default: slack-mcp-server
      image_ref:
        description: |
          Full GHCR image reference to deploy as live.
          Examples:
            ghcr.io/qwickapps/img-slack-mcp-server-dev@sha256:<digest>
            ghcr.io/qwickapps/img-slack-bridge-prod:1.0.0.42
        required: true
        type: string
      environment:
        description: 'Target environment for live slot'
        required: true
        type: choice
        options: [dev, uat, prod]
        default: prod
      health_path:
        description: 'Override health path. Defaults to /sse for slack-mcp-server and /_health for the three P3 apps.'
        required: false
        type: string
        default: ''

concurrency:
  group: slack-promote-live-${{ inputs.app_name }}-${{ inputs.environment }}
  cancel-in-progress: false

env:
  OWNER: qwickapps

jobs:
  promote-to-live:
    runs-on: [self-hosted, macmini]
    steps:
      - name: Validate inputs
        run: |
          IMAGE_REF="${{ inputs.image_ref }}"
          APP="${{ inputs.app_name }}"
          ENV="${{ inputs.environment }}"

          if [ -z "$IMAGE_REF" ]; then
            echo "ERROR: image_ref input is required."
            exit 1
          fi

          case "$APP" in
            slack-mcp-server|slack-bridge|slack-multiplexer|slack-setup) ;;
            *)
              echo "ERROR: unsupported app_name: $APP"
              exit 1
              ;;
          esac

          # The three-app deploy builds one shared image named
          # img-slack-mcp-server-${ENV}; legacy callers may still provide a
          # per-app image. Accept both shapes for qwickapps/mcp#84.
          if ! echo "$IMAGE_REF" | grep -Eq "^ghcr.io/qwickapps/img-(${APP}|slack-mcp-server)-${ENV}([:@])"; then
            echo "ERROR: image_ref does not match app/environment."
            echo "  Got: $IMAGE_REF"
            echo "  Expected: ghcr.io/qwickapps/img-${APP}-${ENV}:<tag>"
            echo "        or: ghcr.io/qwickapps/img-slack-mcp-server-${ENV}@sha256:<digest>"
            exit 1
          fi

          HEALTH_PATH="${{ inputs.health_path }}"
          if [ -z "$HEALTH_PATH" ]; then
            if [ "$APP" = "slack-mcp-server" ]; then
              HEALTH_PATH="/sse"
            else
              HEALTH_PATH="/_health"
            fi
          fi
          case "$HEALTH_PATH" in
            /*) ;;
            *)
              echo "ERROR: health_path must start with /"
              exit 1
              ;;
          esac

          echo "image_ref=${IMAGE_REF}"       >> "$GITHUB_ENV"
          echo "APP_NAME=${APP}"              >> "$GITHUB_ENV"
          echo "HEALTH_PATH=${HEALTH_PATH}"   >> "$GITHUB_ENV"

      - name: Resolve CapRover credentials and slot names
        run: |
          ENV="${{ inputs.environment }}"
          APP="${{ inputs.app_name }}"

          case "$ENV" in
            dev)
              LIVE_APP="${APP}-live"
              CAPROVER_URL="${{ secrets.OCI_DEV_CAPROVER_URL }}"
              CAPROVER_PASSWORD="${{ secrets.OCI_DEV_CAPROVER_PASSWORD }}"
              LIVE_APP_URL="https://${LIVE_APP}.dev.qwickforge.com"
              ;;
            prod)
              LIVE_APP="${APP}-live"
              CAPROVER_URL="${{ secrets.OCI_MAIN_CAPROVER_URL }}"
              CAPROVER_PASSWORD="${{ secrets.OCI_MAIN_CAPROVER_PASSWORD }}"
              LIVE_APP_URL="https://${LIVE_APP}.app.qwickforge.com"
              ;;
            uat)
              LIVE_APP="${APP}-uat"
              CAPROVER_URL="${{ secrets.OCI_MAIN_CAPROVER_URL }}"
              CAPROVER_PASSWORD="${{ secrets.OCI_MAIN_CAPROVER_PASSWORD }}"
              LIVE_APP_URL="https://${LIVE_APP}.app.qwickforge.com"
              ;;
          esac

          if [ -z "$CAPROVER_URL" ] || [ -z "$CAPROVER_PASSWORD" ]; then
            echo "ERROR: CapRover credentials not found for ${ENV}."
            exit 1
          fi

          echo "::add-mask::$CAPROVER_PASSWORD"
          echo "::add-mask::${{ secrets.GHCR_PULL_TOKEN }}"

          echo "LIVE_APP=${LIVE_APP}"                   >> "$GITHUB_ENV"
          echo "CAPROVER_URL=${CAPROVER_URL}"           >> "$GITHUB_ENV"
          echo "CAPROVER_PASSWORD=${CAPROVER_PASSWORD}" >> "$GITHUB_ENV"
          echo "LIVE_APP_URL=${LIVE_APP_URL}"           >> "$GITHUB_ENV"
          echo "GHCR_PULL_TOKEN=${{ secrets.GHCR_PULL_TOKEN }}" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Promote build slot to live
        run: |
          chmod +x .github/scripts/*.sh
          .github/scripts/swap-instances.sh \
            --product "$APP_NAME" \
            --environment "${{ inputs.environment }}" \
            --direction promote \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD" \
            --github-token "$GHCR_PULL_TOKEN" \
            --github-owner "${{ env.OWNER }}" \
            --build-image-ref "$image_ref"

      - name: Validate live slot health
        run: |
          HEALTH_URL="${LIVE_APP_URL}${HEALTH_PATH}"
          echo "Waiting for ${HEALTH_URL} to become healthy..."
          MAX_ATTEMPTS=15
          SLEEP_SEC=20
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            curl -fsS --max-time 2 "$HEALTH_URL" >/dev/null 2>&1
            rc=$?
            echo "  Attempt ${attempt}/${MAX_ATTEMPTS}: curl exit ${rc}"
            if [ "$APP_NAME" = "slack-mcp-server" ]; then
              if [ $rc -eq 0 ] || [ $rc -eq 28 ]; then
                echo "Health check passed (exit ${rc})."
                exit 0
              fi
            elif [ $rc -eq 0 ]; then
              echo "Health check passed."
              exit 0
            fi
            [ "$attempt" -lt "$MAX_ATTEMPTS" ] && sleep "$SLEEP_SEC"
          done
          echo "ERROR: Health check failed after ${MAX_ATTEMPTS} attempts."
          exit 1

      - name: Notify via Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          ENV="${{ inputs.environment }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" = "success" ]; then
            EMOJI="[OK]"
            printf -v MSG '%s\n\n%s\n%s\n%s\n%s\n\n%s\n  app_name: %s\n  image_ref: %s' \
              "${EMOJI} ${APP_NAME} promoted to LIVE (${ENV})" \
              "Image: ${image_ref}" \
              "Live URL: ${LIVE_APP_URL}" \
              "Health: ${LIVE_APP_URL}${HEALTH_PATH}" \
              "Run: ${RUN_URL}" \
              "Next step - to promote to stable, run promote-to-stable.yml with:" \
              "${APP_NAME}" \
              "${image_ref}"
          else
            EMOJI="[FAIL]"
            printf -v MSG '%s\n\n%s\n%s\n\n%s' \
              "${EMOJI} ${APP_NAME} promote-to-live FAILED (${ENV})" \
              "Image: ${image_ref}" \
              "Run: ${RUN_URL}" \
              "Check logs before re-attempting."
          fi

          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}" \
              || echo "WARN: Telegram notification failed (non-fatal)"
          else
            echo "WARN: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set - skipping notification"
          fi
